[project]
name = "dywatch"
version = "0.1.0"
description = "Douyin account post monitor built on Douyin_TikTok_Download_API v5 (read-only HTTP client)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
dywatch = "dywatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dywatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: talks to a real DTK instance; skipped unless --run-live is passed",
]
