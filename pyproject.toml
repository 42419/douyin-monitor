[project]
name = "dywatch"
version = "0.1.0"
description = "Douyin account post monitor built on Douyin_TikTok_Download_API v5 (read-only HTTP client)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dywatch contributors" }]
keywords = ["douyin", "monitor", "dtk", "Douyin_TikTok_Download_API"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # 锁大版本：ruff 的格式化规则会随小版本变，而 CI 每次都装最新的——0.17 把
    # `should_send(...)` 那种折行合并成一行，于是本地绿、CI 红。升级时手动改这里。
    "ruff>=0.17.4,<0.18",
]

[project.scripts]
dywatch = "dywatch.cli:main"

[project.urls]
Homepage = "https://dywatch.yunov.top"
Documentation = "https://dywatch.yunov.top"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dywatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: talks to a real DTK instance; skipped unless --run-live is passed",
]

# 只做格式化，不开 lint 规则：这套代码里"为什么这么做"的注释密度很高，
# 把 lint 打开会逼着人为了过检查去改注释或加 noqa。等真要接 CI 再说。
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".tmp", "node_modules", "data", "log"]

[tool.coverage.run]
source = ["src/dywatch"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
