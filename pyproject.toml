[project]
name = "dywatch"
version = "0.1.0"
description = "Douyin account post monitor built on Douyin_TikTok_Download_API v5 (read-only HTTP client)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[project.scripts]
dywatch = "dywatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dywatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: talks to a real DTK instance; skipped unless --run-live is passed",
]

# 只做格式化，不开 lint 规则：这套代码里"为什么这么做"的注释密度很高，
# 把 lint 打开会逼着人为了过检查去改注释或加 noqa。等真要接 CI 再说。
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".tmp", "node_modules", "data", "log"]
