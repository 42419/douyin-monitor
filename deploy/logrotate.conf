# dywatch 的日志轮转配置。
#
# 安装位置是 **/etc/dywatch/logrotate.conf**，由 /etc/cron.d/dywatch 每小时调用一次。
# 刻意**不放进 /etc/logrotate.d**（老版本放的是那里），原因：
#
#   Armbian 自带 /etc/cron.d/armbian-truncate-logs：每 15 分钟跑一次
#   /usr/lib/armbian/armbian-truncate-logs，当 /var/log 用量 ≥75% 时执行
#   `logrotate --force /etc/logrotate.conf`。--force 会跳过"今天是否已轮转过"的日期判断，
#   把 /etc/logrotate.d 下的配置全部强制轮转一遍——包括本工具装进去的那份。
#   表现就是 monitor.log 每 15 分钟被切一次、14 份归档不到 4 小时就被挤掉。
#   自带独立 cron + 独立 state 文件（/var/lib/dywatch/logrotate.status）之后，
#   别人的 --force 不再影响这里，轮转节奏只由本文件的 daily/maxsize 决定。
#
# 应用只负责分级写入（info 与 debug 各一份，见 runtime.setup_logging），
# 轮转与压缩交给 logrotate —— "日志留多久"只有这一个地方要改。
#
# 路径与属主由 install.sh 按实际安装位置填入（@HOME_DIR@ / @RUN_USER@ / @RUN_GROUP@）。
#
# 注意：注释一律单独成行，不要把 `#` 写在指令后面——logrotate 的解析器对行尾注释并不温和。

@HOME_DIR@/log/info/monitor.log @HOME_DIR@/log/debug/monitor.log {
    # 跨天后的第一次运行切一次；cron 每小时跑，实际就是"每天一次"
    daily
    # 单文件涨过 10M 立即切，最多延迟 1 小时（= cron 的间隔）
    maxsize 10M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0640 @RUN_USER@ @RUN_GROUP@

    # copytruncate 而不是向进程发信号：应用不重开文件句柄，
    # 于是"轮转"这一动作不需要进程配合，也就不会因为它正忙而失败。
}
