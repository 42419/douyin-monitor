# dywatch 的日志轮转。
#
# 应用只负责分级写入（info 与 debug 各一份，见 runtime.setup_logging），
# 轮转与压缩交给 logrotate —— 这是 Linux 的标准分工，也让"日志留多久"
# 这件事只有一个地方要改（在这里，而不是在代码里）。
#
# 路径与属主由 install.sh 按实际安装位置填入（@HOME_DIR@ / @RUN_USER@ / @RUN_GROUP@）。

@HOME_DIR@/log/info/monitor.log @HOME_DIR@/log/debug/monitor.log {
    daily
    rotate 14
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0640 @RUN_USER@ @RUN_GROUP@

    # copytruncate 而不是向进程发信号：应用不重开文件句柄，
    # 于是"轮转"这一动作不需要进程配合，也就不会因为它正忙而失败。
}
